<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Amaranth:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css"> 
        <title>FOODsite</title>
    </head>

    <body>

        <div class="main-content" id="mainContent">

        <header class="header">
            <div class="profile">
                <a href="profile.html" class="prof-link">
                    <img src="0071bf5314a776c70a6ae40c7109bb8b.jpg" alt="Profile" class="prof-icon">
                </a>
            </div>
                <input type="text">
            
            <div class="icons">
            <div class="chat">
                <a href="chat.html">
                <img src="Безымянный-Photoroom.png" alt="chat" class="chat-icon">
                </a>

            </div>
            <div class="basket">
                <a href="basket.html" class="bas-link">
                    <img src="shopping-basket-Photoroom.png" alt="shopping-basket" class="bask-icon">            
                </a>
            </div>
            <div class="settings">
                <img src="i-Photoroom.png" alt="set-icon" class="set-icon" id="openSet">
                
            </div>
        </header>

        <main class="main">

            <div class="fast-food">
                <h1>Fast <br>Food</h1>
                <div class="fast-food-img">
                    <img src="InShot_20261115_220036770.jpg" alt="fastfood" width="280px">
                </div>
            </div>

            <div class="desserts">
                <h1>Desserts</h1>
                <div class="dessert-img">
                    <img src="Capture20261116174747.png" alt="dessert" width="290px">
                </div>
            </div>

            <div class="drinks">
                <h1>Drinks</h1>
                <div class="drinks-img">
                    <img src="InShot_20261115_220348761.jpg" alt="drinks" width="150px">
                </div>
            </div>

            <div class="rolls">
            <div class="sale">BENEFIT</div>
                <h1>Sushi</h1>
                <div class="sushi-img">
                    <img src="InShot_20261115_220846732.jpg" alt="sushi" width="410px">
                </div>
            </div>

            <div class="health-food">
                <h1>Health <br>Food</h1>
                <div class="hlt-food-img">
                    <img src="InShot_20261115_221027817.jpg" alt="health-food" width="150px">
                </div>
            </div>

            <div class="breakfasts">
                <h1>Breakfasts</h1>
                <div class="br-img">
                    <img src="InShot_20261115_221145224.jpg" alt="breakfast" width="300px">
                </div>
            </div>

        </main>

        <footer class="footer">
            <address class="address">
                <div class="ad-text">
                <br>1847 Maplewood Avenue
                <br>Portland, OR 97205
                <br>Email: fastfood88@gmail.com
                </div>
            </address>
            <div class="contacts">
                <h3>Us in:</h3>
                <img src="https://static.vecteezy.com/system/resources/previews/045/934/210/non_2x/instagram-logo-icon-transparent-background-free-png.png" alt="Inst" width="90px" class="inst">
                <img src="https://static.vecteezy.com/system/resources/previews/042/127/139/large_2x/square-tiktok-logo-on-a-transparent-background-free-png.png" alt="TikTok" width="70px" class="tt">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram" width="52px" class="tg">
            </div>
            <div class="last">
                <small>© 2026 all rights reserved.</small>
            </div>
        </footer>

        </div>

        <div class="panel-set" id="panSet">
                    <div class="block-set1">
                        <p>Orders</p>
                        <p>History</p>
                        <p>My reviews</p>
                        <p>Food-card</p>
                   </div>
                    <div class="block-set2">
                        <p>Theme</p>
                        <p>Notifications</p>
                        <p>Privacy</p>
                        <p>Data</p>
                        <p>Language</p>
                    </div>
                    <div class="block-set3">
                        <p>Privacy Policy</p>
                        <p>FAQ</p>
                    </div>
            </div>

        <script src="script.js"></script>
